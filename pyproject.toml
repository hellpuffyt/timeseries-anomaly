[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "timeseries-anomaly"
version = "1.0.0"
description = "Seasonal-aware anomaly detection for metric time series, built on robust statistics"
readme = "README.md"
license = "MIT"
authors = [{ name = "Prabesh Sharma" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: System :: Monitoring",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/hellpuffyt/timeseries-anomaly"
Issues = "https://github.com/hellpuffyt/timeseries-anomaly/issues"

[project.scripts]
timeseries-anomaly = "timeseries_anomaly.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/timeseries_anomaly"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = []

[tool.mypy]
strict = true
# Pinned to a version new enough for numpy's own stub files to parse
# (they use PEP 695 syntax); this does not relax the package's actual
# supported-version floor of 3.10, declared in requires-python above.
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
